# =============================================================================
# Pedidos Veloz - ambiente local completo com UM comando:
#     docker compose up -d --build
#
# Aplicação:      http://localhost:8080   (API Gateway; docs em /docs)
# Jaeger:         http://localhost:16686  (traces distribuídos)
# Prometheus:     http://localhost:9090   (métricas)
# Grafana:        http://localhost:3000   (dashboards; acesso anônimo)
#
# Variáveis: valores padrão abaixo; para sobrescrever, copie .env.example -> .env
# =============================================================================
name: pedidos-veloz

# Configuração comum aos 4 microsserviços (âncora YAML evita repetição)
x-service: &service
  restart: unless-stopped
  networks: [backend]
  environment: &service-env
    APP_ENV: local
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 256M }

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER:-veloz}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-veloz_dev_123}

services:
  # ---------------------------------------------------------------- dados ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veloz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veloz_dev_123}
      POSTGRES_DB: veloz
    volumes:
      - pgdata:/var/lib/postgresql/data          # volume nomeado: dados persistem
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d veloz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------- microsserviços ---
  estoque:
    <<: *service
    build: { context: ., dockerfile: services/estoque/Dockerfile }
    image: ${REGISTRY:-ghcr.io/bonanni92}/pedidos-veloz-estoque:${IMAGE_TAG:-local}
    environment:
      <<: [*service-env, *db-env]
      OTEL_SERVICE_NAME: estoque
      DB_NAME: estoque
    depends_on:
      postgres: { condition: service_healthy }

  pagamentos:
    <<: *service
    build: { context: ., dockerfile: services/pagamentos/Dockerfile }
    image: ${REGISTRY:-ghcr.io/bonanni92}/pedidos-veloz-pagamentos:${IMAGE_TAG:-local}
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: pagamentos
      PAGAMENTO_LIMITE_CENTAVOS: ${PAGAMENTO_LIMITE_CENTAVOS:-500000}
      PAGAMENTO_LATENCIA_MAX_MS: ${PAGAMENTO_LATENCIA_MAX_MS:-300}
      PAGAMENTO_TAXA_FALHA: ${PAGAMENTO_TAXA_FALHA:-0}

  pedidos:
    <<: *service
    build: { context: ., dockerfile: services/pedidos/Dockerfile }
    image: ${REGISTRY:-ghcr.io/bonanni92}/pedidos-veloz-pedidos:${IMAGE_TAG:-local}
    environment:
      <<: [*service-env, *db-env]
      OTEL_SERVICE_NAME: pedidos
      DB_NAME: pedidos
      ESTOQUE_URL: http://estoque:8000
      PAGAMENTOS_URL: http://pagamentos:8000
    depends_on:
      postgres: { condition: service_healthy }
      estoque: { condition: service_healthy }
      pagamentos: { condition: service_healthy }

  gateway:
    <<: *service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: ${REGISTRY:-ghcr.io/bonanni92}/pedidos-veloz-gateway:${IMAGE_TAG:-local}
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: gateway
      PEDIDOS_URL: http://pedidos:8000
      ESTOQUE_URL: http://estoque:8000
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    networks: [frontend, backend]   # única porta de entrada da aplicação
    depends_on:
      pedidos: { condition: service_healthy }
      estoque: { condition: service_healthy }

  # ------------------------------------------------------ observabilidade ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [backend]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    networks: [frontend, backend]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [frontend, backend]

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # somente para ambiente local
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pedidos-veloz.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [frontend, backend]
    depends_on: [prometheus]

# frontend: o que é acessível do host. backend: rede interna, sem saída externa.
networks:
  frontend: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  promdata: {}
