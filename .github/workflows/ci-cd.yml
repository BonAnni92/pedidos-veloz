# =============================================================================
# Pipeline CI/CD - Pedidos Veloz
#
#  PR / push na main:  lint + testes -> validações de infra -> teste E2E (Compose)
#                      -> build -> scan de segurança -> publicação no GHCR (só push)
#  tag vX.Y.Z:         tudo acima + deploy em produção (com aprovação manual)
#
# Nenhuma credencial fica no código: GITHUB_TOKEN (automático) publica as
# imagens; KUBE_CONFIG / DB_USER / DB_PASSWORD vêm de GitHub Secrets do
# ambiente "production".
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  lint-test:
    name: Lint e testes (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, pedidos, estoque, pagamentos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                       # cache de dependências entre execuções
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r services/${{ matrix.service }}/requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check libs services/${{ matrix.service }}

      - name: Testes unitários e de API (pytest + cobertura)
        run: >
          pytest services/${{ matrix.service }}
          --cov=services/${{ matrix.service }}/app --cov=libs/veloz_common
          --cov-report=term-missing --junitxml=test-report-${{ matrix.service }}.xml

      - name: Publicar relatório de testes (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: test-report-${{ matrix.service }}.xml

  # ---------------------------------------------------------------------------
  validate-infra:
    name: Validação de infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint dos Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: Dockerfile

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Instalar kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validar manifests Kubernetes (Kustomize + kubeconform)
        run: |
          for dir in k8s/overlays/local k8s/overlays/prod k8s/observability; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -kubernetes-version 1.31.0 -
            echo "::endgroup::"
          done

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt + validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          for env in dev prod; do
            terraform -chdir=terraform/envs/$env init -backend=false -input=false
            terraform -chdir=terraform/envs/$env validate
          done

  # ---------------------------------------------------------------------------
  e2e-compose:
    name: Teste ponta a ponta (Docker Compose)
    needs: [lint-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente completo (um único comando)
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test pelo API Gateway
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan e publicação (${{ matrix.service }})
    needs: [lint-test, validate-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publicar no GitHub Container Registry
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, pedidos, estoque, pagamentos]
    steps:
      - uses: actions/checkout@v4

      - name: Variáveis da imagem
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Versionamento: sha-<commit> (imutável e rastreável), semver nas tags
      # de release (1.2.3 e 1.2) e "latest" apenas na branch principal.
      - name: Metadados e tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/pedidos-veloz-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (imagem local para o scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: scan/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Gate de segurança: falha se houver vulnerabilidade CRÍTICA com correção.
      - name: Scan de vulnerabilidades (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            aquasec/trivy:0.58.1 image --no-progress \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            scan/${{ matrix.service }}:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            aquasec/trivy:0.58.1 image --no-progress --quiet \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            scan/${{ matrix.service }}:${{ github.sha }}

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy em produção (rolling update)
    needs: [build-scan-push, e2e-compose]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # O ambiente "production" pode exigir aprovação manual (Settings > Environments
    # > Required reviewers): é o gate final antes de mexer em produção.
    environment:
      name: production
    concurrency: deploy-production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se há cluster configurado
        id: check
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::Secret KUBE_CONFIG não configurado - deploy ignorado (imagens já publicadas)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar acesso ao cluster
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Criar/atualizar Secret do banco (a partir dos GitHub Secrets)
        if: steps.check.outputs.enabled == 'true'
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl -n loja-veloz create secret generic veloz-db-credentials \
            --from-literal=username="$DB_USER" --from-literal=password="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Fixar a tag imutável das imagens (sha do commit)
        if: steps.check.outputs.enabled == 'true'
        run: |
          sed -i -E "s/newTag: [^ }]+/newTag: sha-${GITHUB_SHA::7}/" k8s/overlays/prod/kustomization.yaml
          kubectl kustomize k8s/overlays/prod | grep "image:"

      - name: Aplicar manifests e acompanhar o rollout
        if: steps.check.outputs.enabled == 'true'
        run: |
          kubectl apply -k k8s/overlays/prod
          for d in estoque pagamentos pedidos gateway; do
            kubectl -n loja-veloz rollout status deployment/$d --timeout=300s
          done

      - name: Rollback automático em caso de falha
        if: failure() && steps.check.outputs.enabled == 'true'
        run: |
          for d in estoque pagamentos pedidos gateway; do
            kubectl -n loja-veloz rollout undo deployment/$d || true
          done
